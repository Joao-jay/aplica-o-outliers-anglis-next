<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Três Frentes | Outliers × ANGLIS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --violeta:#6B66FF;
  --amarelo:#FFDD00;
  --laranja:#FB7421;
  --texto:#333333;
  --branco:#FFFFFF;
  --preto:#1A1A1A;
  --sombra:0 14px 30px rgba(40,40,60,.16);
  --fonte:'Poppins', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--fonte);
  background: var(--branco);
  color: var(--texto);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(24px, 5vw, 56px);
}

/* Fundo geométrico: triângulo violeta à esquerda, amarelo à direita */
.fundo {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: var(--branco);
  overflow: hidden;
}
.fundo::before,
.fundo::after {
  content: "";
  position: absolute;
  inset: 0;
}
.fundo::before {
  background: var(--violeta);
  clip-path: polygon(0 36%, 0 100%, 50% 100%);
}
.fundo::after {
  background: var(--amarelo);
  clip-path: polygon(100% 5%, 100% 100%, 51% 100%);
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  width: 100%;
}

header {
  text-align: center;
  margin-bottom: 40px;
}

.brands {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(16px, 4vw, 56px);
  margin-bottom: 28px;
}

.brands img {
  width: 200px;
  height: 200px;
  max-width: 46%;
  object-fit: contain;
  display: block;
}

h1 {
  font-size: clamp(1.9rem, 4.6vw, 3rem);
  font-weight: 600;
  letter-spacing: -.035em;
  line-height: 1.15;
  color: var(--texto);
}

.sub {
  font-weight: 300;
  color: var(--texto);
  font-size: clamp(1rem, 1.6vw, 1.2rem);
  margin-top: 10px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(16px, 3vw, 40px);
  margin-bottom: 36px;
}

.card {
  font-family: inherit;
  color: inherit;
  background: rgba(255,255,255,.84);
  border: 2px solid transparent;
  border-radius: 36px;
  padding: 28px;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--sombra);
  transition: transform .15s ease, border-color .15s ease;
}

.card:hover { transform: translateY(-3px); }

.card:focus-visible {
  outline: 3px solid var(--preto);
  outline-offset: 3px;
}

.card.active {
  background: var(--branco);
  border-color: var(--laranja);
}

.topo {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 16px;
}

.num {
  flex: none;
  width: 49px;
  height: 49px;
  border-radius: 12px;
  background: var(--laranja);
  color: var(--branco);
  font-weight: 700;
  font-size: 1.1rem;
  display: grid;
  place-items: center;
}

.card h2 {
  font-size: 1.3rem;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.2;
}

.card p {
  font-weight: 300;
  font-size: 1.1rem;
  line-height: 1.55;
}

.player {
  background: var(--branco);
  border-radius: 36px;
  padding: 16px;
  box-shadow: var(--sombra);
}

video {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 24px;
  background: var(--preto);
  display: block;
}

.placeholder {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 24px;
  background: var(--preto);
  color: var(--branco);
  display: grid;
  place-items: center;
  text-align: center;
  padding: 24px;
}

.placeholder strong {
  color: var(--amarelo);
  font-weight: 600;
  display: block;
  margin-bottom: 6px;
}

.placeholder span {
  font-weight: 300;
  color: #D9D9E3;
  font-size: .95rem;
}

@media (max-width: 860px) {
  .cards { grid-template-columns: 1fr; }
  body { justify-content: flex-start; }
  .card { padding: 22px; border-radius: 28px; }
  .player { border-radius: 28px; }
  .fundo::before { clip-path: polygon(0 55%, 0 100%, 70% 100%); }
  .fundo::after { clip-path: polygon(100% 25%, 100% 100%, 60% 100%); }
}

@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .card:hover { transform: none; }
}
</style>
</head>
<body>
  <div class="fundo" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <div class="brands">
        <img src="logo-outliers.png" alt="Logo Outliers">
        <img src="logo-anglis.png" alt="Logo Anglis">
      </div>
      <h1>Três frentes. Uma jornada.</h1>
      <p class="sub">Toque em uma frente para assistir ao vídeo.</p>
    </header>

    <div class="cards">
      <button class="card" onclick="play('video1', this)">
        <div class="topo">
          <div class="num">01</div>
          <h2>Ser encontrada</h2>
        </div>
        <p>Construir uma presença digital que ajude o público a descobrir a solução.</p>
      </button>

      <button class="card" onclick="play('video2', this)">
        <div class="topo">
          <div class="num">02</div>
          <h2>Gerar confiança</h2>
        </div>
        <p>Conectar a tecnologia às necessidades reais de quem cuida.</p>
      </button>

      <button class="card" onclick="play('video3', this)">
        <div class="topo">
          <div class="num">03</div>
          <h2>Ser experimentada</h2>
        </div>
        <p>Levar a proposta para uma experiência que aproxime o público da solução.</p>
      </button>
    </div>

    <div class="player" id="player">
      <div class="placeholder">
        <div>
          <strong>Selecione uma frente</strong>
          <span>Toque em um dos cartões acima para reproduzir o vídeo.</span>
        </div>
      </div>
    </div>
  </div>

<script>
  const videos = {
    video1: 'https://res.cloudinary.com/hlk8qlu7/video/upload/v1792815173/ser-encontrada.mp4',
    video2: 'https://res.cloudinary.com/hlk8qlu7/video/upload/v1792815252/gerar-confianca.mp4',
    video3: 'https://res.cloudinary.com/hlk8qlu7/video/upload/v1792815101/ser-experimentada.mp4'
  };

  let current = null;

  function play(key, btn) {
    const url = videos[key];
    const player = document.getElementById('player');

    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');

    if (current) {
      current.pause();
      current.src = url;
      current.load();
    } else {
      player.innerHTML = '';
      current = document.createElement('video');
      current.controls = true;
      current.playsInline = true;
      current.autoplay = true;
      current.src = url;
      player.appendChild(current);
    }

    const reduz = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    player.scrollIntoView({ behavior: reduz ? 'auto' : 'smooth', block: 'center' });

    current.play().catch(() => {
      player.innerHTML =
        '<div class="placeholder"><div><strong>Não foi possível reproduzir</strong><span>Verifique o link do vídeo no código.</span></div></div>';
      current = null;
    });
  }
</script>
</body>
</html>
